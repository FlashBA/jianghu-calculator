<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>功法秘卷 · UI 复原预览</title>
    <style>
      :root {
        --black: #0a0a0a;
        --ink: #171717;
        --muted: #6b6b68;
        --canvas: #f6f5f1;
        --panel: #fcfbf8;
        --field: #f1f0ec;
        --line: #d5d4cf;
        --red: #b54030;
        --gold: #d39a27;
        --white: #f8f8f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--black);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--black);
      }

      button {
        font: inherit;
      }

      .icon {
        display: block;
        width: 1em;
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .section-icon .icon-sword-source {
        display: block;
        width: 1.12em;
        height: 1.12em;
        object-fit: contain;
        object-position: center;
      }

      .icon-fill {
        fill: currentColor;
        stroke: currentColor;
      }

      .phone-stage {
        width: min(100%, 430px);
        min-height: 100vh;
        margin: 0 auto;
        overflow: hidden;
        background: var(--black);
      }

      .system-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 76px;
        padding: 26px 24px 10px;
        color: #e7e7e7;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .system-right {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #d5d5d5;
        font-size: 13px;
      }

      .system-icon {
        width: 16px;
        height: 16px;
      }

      .signal {
        display: inline-flex;
        align-items: end;
        gap: 2px;
        height: 17px;
      }

      .signal i {
        display: block;
        width: 3px;
        background: #dadada;
        border-radius: 2px 2px 0 0;
      }

      .signal i:nth-child(1) { height: 6px; }
      .signal i:nth-child(2) { height: 10px; }
      .signal i:nth-child(3) { height: 14px; }
      .signal i:nth-child(4) { height: 17px; }

      .app-toolbar {
        display: grid;
        grid-template-columns: 52px 1fr 52px;
        align-items: center;
        min-height: 126px;
        padding: 14px 20px 24px;
        color: var(--white);
      }

      .toolbar-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        color: #e7e7e7;
        font-size: 32px;
        line-height: 1;
      }

      .toolbar-button {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 0;
        color: #e7e7e7;
        background: transparent;
        cursor: pointer;
      }

      .toolbar-title {
        justify-self: center;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      .toolbar-title::after {
        content: "";
        display: inline-block;
        margin-left: 7px;
        border: 6px solid transparent;
        border-top-color: #aaa;
        transform: translateY(4px);
      }

      .toolbar-actions {
        display: flex;
        justify-content: end;
        gap: 8px;
      }

      .expand-mark {
        font-size: 30px;
      }

      .gear-mark {
        width: 40px;
        height: 40px;
        font-size: 29px;
      }

      .sheet {
        min-height: calc(100vh - 202px);
        padding: 28px 20px 54px;
        border: 2px solid #272727;
        border-bottom: 0;
        border-radius: 34px 34px 0 0;
        background: var(--canvas);
      }

      .sheet-header {
        display: grid;
        grid-template-columns: 84px 1fr 42px;
        align-items: center;
        min-height: 78px;
        margin: -28px -20px 22px;
        padding: 0 24px;
        border-bottom: 2px solid var(--line);
        background: var(--panel);
      }

      .back-button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-size: 19px;
        font-weight: 700;
        white-space: nowrap;
      }

      .back-arrow {
        width: 30px;
        height: 30px;
        font-size: 30px;
      }

      .sheet-title {
        justify-self: center;
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .bookmark {
        justify-self: end;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--red);
        font-size: 30px;
        cursor: pointer;
      }

      .bookmark.is-saved {
        color: var(--red);
      }

      .info-card,
      .section-card {
        margin-bottom: 20px;
        padding: 22px 20px;
        border: 2px solid var(--line);
        background: var(--panel);
      }

      .info-heading {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }

      .skill-name {
        margin: 0;
        font-size: 31px;
        font-weight: 800;
        line-height: 1.1;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 3px 12px;
        border: 2px solid var(--red);
        color: var(--red);
        font-size: 18px;
        font-weight: 750;
        line-height: 1;
      }

      .tag-filled {
        color: var(--white);
        background: var(--red);
      }

      .obtain-box,
      .effect-box {
        padding: 14px 16px;
        border: 2px solid var(--line);
        background: var(--field);
        font-size: 17px;
        font-weight: 550;
        line-height: 1.45;
      }

      .obtain-box strong {
        color: var(--red);
        font-weight: 800;
      }

      .section-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 18px;
        font-size: 21px;
        font-weight: 800;
        line-height: 1.2;
      }

      .section-icon {
        display: grid;
        place-items: center;
        width: 28px;
        height: 30px;
        color: var(--red);
        font-size: 27px;
        text-align: center;
      }

      .section-icon.gold {
        color: var(--gold);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        display: grid;
        align-content: center;
        min-height: 92px;
        padding: 10px 6px;
        border: 2px solid var(--line);
        background: var(--field);
        text-align: center;
      }

      .stat-label {
        color: var(--muted);
        font-size: 15px;
        font-weight: 500;
        line-height: 1.3;
      }

      .stat-value {
        margin-top: 4px;
        color: var(--ink);
        font-size: 25px;
        font-weight: 800;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .stat-value.red {
        color: var(--red);
      }

      .stat-value.gold {
        color: var(--gold);
      }

      .effect-group + .effect-group {
        margin-top: 22px;
      }

      .effect-box {
        min-height: 78px;
        display: flex;
        align-items: center;
        padding: 16px;
        font-size: 18px;
      }

      .icon-button {
        padding: 0;
        border: 0;
        color: inherit;
        background: transparent;
        cursor: pointer;
      }

      @media (min-width: 700px) {
        body {
          padding: 24px;
        }

        .phone-stage {
          min-height: 900px;
          border-radius: 28px;
          box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }

        .sheet {
          min-height: 698px;
        }
      }

      @media (max-width: 370px) {
        .sheet {
          padding-inline: 14px;
        }

        .sheet-header {
          margin-inline: -14px;
          padding-inline: 16px;
        }

        .skill-name {
          font-size: 27px;
        }

        .sheet-title {
          font-size: 17px;
        }

        .stats-grid {
          gap: 7px;
        }

        .stat {
          min-height: 86px;
        }

        .stat-value {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="icon-x" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </symbol>
        <symbol id="icon-maximize-2" viewBox="0 0 24 24">
          <path d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7"></path>
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </symbol>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24">
          <path d="m12 19-7-7 7-7M5 12h14"></path>
        </symbol>
        <symbol id="icon-bookmark" viewBox="0 0 24 24">
          <path d="M6 3h12a2 2 0 0 1 2 2v16l-8-4-8 4V5a2 2 0 0 1 2-2z"></path>
        </symbol>
        <symbol id="icon-bookmark-filled" viewBox="0 0 24 24">
          <path class="icon-fill" d="M6 3h12a2 2 0 0 1 2 2v16l-8-4-8 4V5a2 2 0 0 1-2-2z"></path>
        </symbol>
        <symbol id="icon-zap" viewBox="0 0 24 24">
          <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.8a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 9h7a1 1 0 0 1 .78 1.63l-9.9 10.8a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path>
        </symbol>
        <symbol id="icon-sparkles" viewBox="0 0 24 24">
          <path d="m12 3-1.91 5.81a2 2 0 0 1-1.28 1.28L3 12l5.81 1.91a2 2 0 0 1 1.28 1.28L12 21l1.91-5.81a2 2 0 0 1 1.28-1.28L21 12l-5.81-1.91a2 2 0 0 1-1.28-1.28zM5 3v4M19 17v4M3 5h4M17 19h4"></path>
        </symbol>
        <symbol id="icon-star" viewBox="0 0 24 24">
          <path d="m12 3 2.78 5.63 6.22.9-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.92 1.06-6.2L3 9.53l6.22-.9z"></path>
        </symbol>
        <symbol id="icon-bell-off" viewBox="0 0 24 24">
          <path d="M13.73 21a2 2 0 0 1-3.46 0M18.63 13A17.9 17.9 0 0 1 18 8M6.26 6.26A5.9 5.9 0 0 0 6 8c0 7-3 7-3 9h14M2 2l20 20"></path>
        </symbol>
        <symbol id="icon-bluetooth" viewBox="0 0 24 24">
          <path d="m6.5 6.5 11 11M6.5 17.5l11-11M12 2v20l5.5-5.5L6.5 7.5 12 2z"></path>
        </symbol>
      </defs>
    </svg>

    <main class="phone-stage">
      <header>
        <div class="system-bar">
          <span>17:52</span>
          <div class="system-right">
            <svg class="icon system-icon"><use href="#icon-bell-off"></use></svg>
            <svg class="icon system-icon"><use href="#icon-bluetooth"></use></svg>
            <span>0.00<br><small>KB/S</small></span>
            <span>5G</span>
            <span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>36%</span>
          </div>
        </div>
        <div class="app-toolbar">
          <span class="toolbar-icon" aria-hidden="true">
            <svg class="icon"><use href="#icon-x"></use></svg>
          </span>
          <div class="toolbar-title">首页</div>
          <div class="toolbar-actions">
            <span class="toolbar-icon expand-mark" aria-hidden="true">
              <svg class="icon"><use href="#icon-maximize-2"></use></svg>
            </span>
            <span class="toolbar-icon gear-mark" aria-hidden="true">
              <svg class="icon"><use href="#icon-settings"></use></svg>
            </span>
          </div>
        </div>
      </header>

      <section class="sheet">
        <div class="sheet-header">
          <button class="back-button" type="button">
            <span class="back-arrow" aria-hidden="true">
              <svg class="icon"><use href="#icon-arrow-left"></use></svg>
            </span>
            <span>返回</span>
          </button>
          <h1 class="sheet-title">功法秘卷 · 倚天剑诀</h1>
          <button class="bookmark" id="bookmark-button" type="button" aria-label="收藏" aria-pressed="false">
            <svg class="icon"><use href="#icon-bookmark"></use></svg>
          </button>
        </div>

        <article class="info-card">
          <div class="info-heading">
            <h2 class="skill-name">倚天剑诀</h2>
            <span class="tag tag-filled">剑法</span>
            <span class="tag">10S</span>
          </div>
          <div class="obtain-box">
            <strong>获取途径：</strong>
            峨眉派华藏庵学习，限1
          </div>
        </article>

        <article class="section-card">
          <h2 class="section-heading">
            <span class="section-icon" aria-hidden="true">
              <img class="icon-sword-source" src="assets/combat-swords-red.png" alt="">
            </span>
            <span>功法战力数值盘</span>
          </h2>
          <div class="stats-grid">
            <div class="stat"><span class="stat-label">威力</span><strong class="stat-value red">1550</strong></div>
            <div class="stat"><span class="stat-label">出手速度</span><strong class="stat-value">108</strong></div>
            <div class="stat"><span class="stat-label">攻击范围</span><strong class="stat-value">随1</strong></div>
            <div class="stat"><span class="stat-label">破防特性</span><strong class="stat-value gold">破招</strong></div>
            <div class="stat"><span class="stat-label">暴击率</span><strong class="stat-value">10%</strong></div>
            <div class="stat"><span class="stat-label">暴击伤害倍率</span><strong class="stat-value">2.5x</strong></div>
          </div>
        </article>

        <article class="section-card">
          <div class="effect-group">
            <h2 class="section-heading">
              <span class="section-icon gold" aria-hidden="true">
                <svg class="icon"><use href="#icon-zap"></use></svg>
              </span>
              <span>特殊技能触发机制</span>
            </h2>
            <div class="effect-box">倚天剑增加10%暴击率，随3</div>
          </div>
          <div class="effect-group">
            <h2 class="section-heading">
              <span class="section-icon" aria-hidden="true">
                <svg class="icon"><use href="#icon-sparkles"></use></svg>
              </span>
              <span>BUFF 增益与负面效果</span>
            </h2>
            <div class="effect-box">25%概率5%流血，降低18%攻击两回合</div>
          </div>
        </article>

        <article class="section-card">
          <h2 class="section-heading">
            <span class="section-icon" aria-hidden="true">
              <svg class="icon"><use href="#icon-star"></use></svg>
            </span>
            <span>推荐习练随从（剑法）</span>
          </h2>
        </article>
      </section>
    </main>

    <script>
      const bookmark = document.getElementById('bookmark-button');
      bookmark.addEventListener('click', () => {
        const saved = bookmark.getAttribute('aria-pressed') === 'true';
        bookmark.setAttribute('aria-pressed', String(!saved));
        bookmark.classList.toggle('is-saved', !saved);
        bookmark.innerHTML = saved
          ? '<svg class="icon"><use href="#icon-bookmark"></use></svg>'
          : '<svg class="icon icon-fill"><use href="#icon-bookmark-filled"></use></svg>';
      });
    </script>
  </body>
</html>
