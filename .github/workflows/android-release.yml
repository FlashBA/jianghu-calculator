name: Build and release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'APK version, for example 0.2.0'
        required: true
        default: '0.2.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Prepare signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          test -n "$APK_KEYSTORE_BASE64"
          mkdir -p android-app/build
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > android-app/build/jianghu-debug.keystore

      - name: Resolve release version
        env:
          MANUAL_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION_NAME="$MANUAL_VERSION_NAME"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION_NAME" in
            ''|*[!0-9.]*) echo "Invalid version: $VERSION_NAME" >&2; exit 1 ;;
          esac
          VERSION_CODE=$(printf '%s' "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          APK_KEYSTORE: android-app/build/jianghu-debug.keystore
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: ./android-app/build-apk.sh

      - name: Verify release signing certificate
        env:
          APK_PATH: android-app/artifacts/jianghu-calculator-${{ env.VERSION_NAME }}.apk
        run: |
          EXPECTED_CERT='82:BB:BD:AF:E8:0E:C0:9B:92:F0:7D:B1:27:8D:37:03:6D:4E:55:E4:C1:9E:29:48:B3:FA:5A:D5:FD:B5:2D:39'
          ACTUAL_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH" \
            | sed -n 's/.*SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            1. 优化收藏
            2. 优化原本攻略 chunk 块可视化 UI
            3. 优化下载方式
          files: android-app/artifacts/jianghu-calculator-${{ env.VERSION_NAME }}.apk
